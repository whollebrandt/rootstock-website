<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plan an Event | Rootstock Cider &amp; Spirits</title><style>:root{color-scheme:dark;--bg:#0e1110;--surface:#1a201d;--ink:#f2eee7;--muted:#b7b9b2;--copper:#dfbd9d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}header,footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;padding:18px clamp(20px,6vw,90px);background:#0b100f;border-bottom:1px solid #c9a27c40}header img{display:block;width:min(220px,65vw);height:auto}nav{display:flex;flex-wrap:wrap;gap:14px 22px;font-size:14px}a{color:inherit;text-underline-offset:.25em}nav a{text-decoration:none}nav a:hover{text-decoration:underline}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--copper);outline-offset:3px}main{width:min(100% - 40px,1060px);margin:auto;padding:clamp(35px,7vw,85px) 0}h1,h2{font:clamp(38px,7vw,80px)/1 Georgia,serif;margin:8px 0 18px}h2{font-size:clamp(26px,4vw,42px)}.eyebrow,.tag{color:var(--copper);font-size:12px;letter-spacing:.19em;text-transform:uppercase}.sub,footer{color:var(--muted)}.bar-section{margin-top:40px}.bar-section ul{padding-left:22px}.inquiry-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:820px;padding:clamp(16px,3vw,30px);background:#1a201ded;border:1px solid #ffffff24;border-radius:20px}.inquiry-form .wide{grid-column:1/-1}.inquiry-form label{display:grid;gap:7px}.inquiry-form :is(input,select,textarea){width:100%;min-width:0;padding:11px;background:var(--bg);border:1px solid #ffffff55;border-radius:8px;color:var(--ink);font:inherit}.inquiry-form p{margin:0}.inquiry-form button{justify-self:start;cursor:pointer;border:0;border-radius:100px;padding:13px 22px;background:#eee6db;color:#141815;font:inherit}@media(max-width:620px){.inquiry-form{grid-template-columns:1fr}}.specials-list{list-style:none;margin:12px 0;padding:0;display:grid;gap:8px}.specials-list span{display:block;color:var(--muted);margin-top:3px}</style><link rel="stylesheet" href="interior-watermark.css"></head>
<body class="interior-page"><header><a href="./" aria-label="Rootstock home"><img src="assets/rootstock-logo-white.png" width="2048" height="444" alt="Rootstock Cider &amp; Spirits"></a><nav aria-label="Main navigation"><a href="./">Home</a><a href="menu.html">Food Menu</a><a href="bar-menu.html">Cider &amp; Spirits</a><a href="./#events">Events Calendar</a><a href="plan-an-event.html">Plan an Event</a></nav></header><main><section class="section" id="inquiry" aria-labelledby="inquiry-title">
<div class="section-head"><div><div class="eyebrow">Private gatherings</div><h1 id="inquiry-title">Plan an Event</h1><p class="sub">Share a few details so our events team can follow up.</p></div></div>
<form id="inquiry-form" class="inquiry-form" method="post">
<p id="inquiry-note" class="sub wide">Preview mode. This form does not send email yet.</p>
<label>Name<input name="name" autocomplete="name" required maxlength="120"></label>
<label>Email<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
<label>Phone (optional)<input name="phone" type="tel" autocomplete="tel" maxlength="40"></label>
<label>Event type<select name="event_type" required><option value="">Select an event type</option><option>Birthday or celebration</option><option>Wedding or rehearsal dinner</option><option>Corporate or group event</option><option>Other</option></select></label>
<label>Preferred date (optional)<input name="preferred_date" type="date"></label>
<label>Estimated guest count<input name="guest_count" type="number" min="1" step="1" required></label>
<label class="wide">Anything else we should know? (optional)<textarea name="details" rows="5" maxlength="3000"></textarea></label>
<button type="submit" disabled class="action primary wide">Preview Submission</button>
<p id="inquiry-status" class="sub wide" role="status"></p>
</form>
</section></main><footer>Rootstock Cider &amp; Spirits · Williamson, New York</footer><script>
const inquiryForm = document.querySelector('#inquiry-form');
const inquiryStatus = document.querySelector('#inquiry-status');
// Use a verified form service endpoint that delivers to events@rootstockciderandspirits.com.
const inquiryEndpoint = '';
inquiryForm.querySelector('button').disabled = false;
if (inquiryEndpoint) {
  inquiryForm.action = inquiryEndpoint;
  inquiryForm.querySelector('button').textContent = 'Send Inquiry';
  document.querySelector('#inquiry-note').textContent = 'We’ll use your contact details to respond to your inquiry.';
} else {
  inquiryForm.addEventListener('submit', event => {
    event.preventDefault();
    inquiryStatus.textContent = 'Preview submission complete. Your details were not sent.';
  });
}
</script></body></html>
