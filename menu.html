<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Menu | Rootstock Cider &amp; Spirits</title>
<style>
:root { color-scheme: dark; --background:#0e1110; --text:#f2eee7; --muted:#b7b9b2; --copper:#dfbd9d; --border:#c9a27c40; }
* { box-sizing:border-box; }
body { margin:0; color:var(--text); background:var(--background); font:16px/1.5 system-ui,sans-serif; }
a { color:inherit; text-decoration:none; }
a:hover { text-decoration:underline; text-underline-offset:.25em; }
a:focus-visible, button:focus-visible { outline:2px solid var(--copper); outline-offset:4px; }
header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px 24px; padding:17px clamp(18px,5vw,90px); border-bottom:1px solid var(--border); background:#0b100f; }
.brand img { display:block; width:min(220px,70vw); height:auto; }
nav { display:flex; align-items:center; flex-wrap:wrap; gap:8px clamp(12px,2.2vw,28px); font-size:13px; font-weight:600; letter-spacing:.035em; }
nav [aria-current] { color:var(--copper); }
main { width:min(1200px,100%); margin:auto; padding:clamp(38px,6vw,86px) clamp(16px,4vw,46px) 76px; }
.intro { text-align:center; margin:0 auto 36px; }
.eyebrow { font-size:12px; letter-spacing:.26em; text-transform:uppercase; color:var(--copper); }
h1 { font:clamp(52px,8vw,104px)/1 Georgia,serif; letter-spacing:-.045em; margin:8px 0 12px; }
.intro p { margin:0; color:var(--muted); }
.spread { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(18px,3vw,32px); }
figure { margin:0; }
.menu-page { display:block; width:100%; padding:0; cursor:zoom-in; border:1px solid var(--border); border-radius:13px; overflow:hidden; background:#1a201d; box-shadow:0 20px 45px #0005; }
.menu-page:hover { border-color:var(--copper); }
.menu-page img { display:block; width:100%; height:auto; }
figcaption { text-align:center; color:var(--muted); font-size:13px; margin-top:12px; }
footer { display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; padding:34px clamp(18px,5vw,90px); border-top:1px solid var(--border); color:var(--muted); }
footer strong { color:var(--text); }
dialog { max-width:none; max-height:none; width:100%; height:100%; margin:0; padding:0; border:0; background:var(--background); color:var(--text); }
dialog form { position:sticky; top:0; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 18px; background:#0e1110; border-bottom:1px solid var(--border); }
dialog button { font:inherit; color:var(--text); background:#1a201d; border:1px solid var(--copper); border-radius:100px; padding:6px 15px; cursor:pointer; }
dialog img { display:block; width:min(100%,1000px); height:auto; margin:auto; }
dialog img.zoomed { width:1000px; max-width:none; }
@media(max-width:700px) { .spread { grid-template-columns:1fr; } }
.weekly{margin-top:clamp(48px,7vw,90px);scroll-margin-top:18px}.weekly h2{font:clamp(34px,5vw,56px)/1.05 Georgia,serif;letter-spacing:-.035em;margin:0 0 20px}.weekly-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto 1fr;align-items:start;gap:10px clamp(16px,3vw,34px);padding:clamp(16px,3vw,30px);max-width:800px;border:1px solid var(--border);border-radius:18px;background:#1a201d}.weekly-card img{grid-row:span 2;display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;object-position:center 55%;border-radius:10px}.weekly-card h3{font:clamp(24px,3vw,34px)/1.1 Georgia,serif;margin:6px 0 0}.weekly-card p{margin:0;color:var(--muted)}@media(max-width:620px){.weekly-card{grid-template-columns:1fr;grid-template-rows:auto}.weekly-card img{grid-row:auto}}
</style>
<script src="weekly-special.js" defer></script>
</head>
<body>
<header>
  <a class="brand" href="./" aria-label="Rootstock home"><img src="assets/rootstock-logo-white.png" width="2048" height="444" alt="Rootstock Cider &amp; Spirits"></a>
  <nav aria-label="Main navigation">
    <a href="./">Home</a>
    <a href="#" aria-current="page">Our Menu</a>
    <a href="#specials">Weekly Specials</a>
    <a href="./music.html">Music</a>
    <a href="./about.html">About</a>
    <a href="./#events">What’s Happening</a>
  </nav>
</header>
<main>
  <div class="intro">
    <span class="eyebrow">Rootstock Cider &amp; Spirits</span>
    <h1>Our Menu</h1>
    <p>Select either page to enlarge it.</p>
  </div>
  <div class="spread">
    <figure>
      <button class="menu-page" type="button" aria-label="Enlarge the front of the food menu"><img src="https://images.squarespace-cdn.com/content/v1/5b2c0758b27e39f8f8a97d55/4f96c9e2-fe3f-4f3a-af1c-bc0c0448d901/Front+Final+%28Dec.+2025%29.png" width="1545" height="2000" alt="Front of the Rootstock food menu"></button>
      <figcaption>Food menu · Front</figcaption>
    </figure>
    <figure>
      <button class="menu-page" type="button" aria-label="Enlarge the back of the food menu"><img src="https://images.squarespace-cdn.com/content/v1/5b2c0758b27e39f8f8a97d55/769e28b4-153d-406a-93d3-16038170bae0/Back+Final+%28December+2025%29.png" width="1545" height="2000" alt="Back of the Rootstock food menu"></button>
      <figcaption>Food menu · Back</figcaption>
    </figure>
  </div>
  <section class="weekly" id="specials" aria-labelledby="specials-title">
    <h2 id="specials-title">Weekly Specials</h2>
    <article class="weekly-card" data-weekly-special></article>
  </section>
</main>
<footer><strong>ROOTSTOCK CIDER &amp; SPIRITS</strong><span>Williamson, New York</span></footer>
<dialog aria-label="Enlarged food menu">
  <form method="dialog">
    <button type="button" id="zoom" aria-pressed="false">Zoom in</button>
    <button autofocus>Close</button>
  </form>
  <img width="1545" height="2000" alt="">
</dialog>
<script>
const dialog = document.querySelector('dialog');
const enlarged = dialog.querySelector('img');
const zoom = document.querySelector('#zoom');

function setZoom(enabled) {
  enlarged.classList.toggle('zoomed', enabled);
  zoom.setAttribute('aria-pressed', String(enabled));
  zoom.textContent = enabled ? 'Fit to screen' : 'Zoom in';
  if (!enabled) dialog.scrollLeft = 0;
}

for (const button of document.querySelectorAll('.menu-page')) {
  button.addEventListener('click', () => {
    const image = button.querySelector('img');
    enlarged.src = image.src;
    enlarged.alt = image.alt;
    setZoom(false);
    dialog.showModal();
    dialog.scrollTop = 0;
  });
}

zoom.addEventListener('click', () => setZoom(!enlarged.classList.contains('zoomed')));
</script>
</body>
</html>
